name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & static checks ──────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff (syntax + style)
        run: ruff check . --select E,F,W --ignore E501
        # E501 = line-too-long (not enforced in trading bots)

  # ── Unit & integration tests ──────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Prevent any real exchange or Telegram connections
          BINANCE_API_KEY: "ci_fake_key"
          BINANCE_API_SECRET: "ci_fake_secret"
          TRADING_ENV: "TESTNET"
          EXECUTION_MODE: "PAPER"
          ANALYSIS_ONLY: "True"
          TELEGRAM_ENABLED: "false"
          LOG_LEVEL: "WARNING"
        run: |
          pytest tests/ \
            -q \
            --tb=short \
            --timeout=180 \
            -x \
            --no-header

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            logs/

  # ── Docker build validation ───────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: trading-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
